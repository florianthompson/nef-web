<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEF Notizen – Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--card:#18181b;--sec:#27272a;--border:rgba(255,255,255,.08);--hair:rgba(255,255,255,.06);
  --fg:#fafafa;--muted:#a1a1aa;--dim:#71717a;--orange:#f97316;--osoft:rgba(249,115,22,.6);--radius:.625rem;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow-x:hidden}
body{font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input{font-family:inherit}
svg{display:block;flex:none}
#app{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:501px){
  html,body{background:#000}
  #app{max-width:390px;margin:0 auto;box-shadow:0 0 0 1px var(--border)}
}
.mock{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:8px;z-index:60;font:500 9px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;opacity:.6;pointer-events:none}
.mono{font-family:var(--mono)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* feed */
.fh{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 20px) 16px 8px}
.fh h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em;flex:1}
.veh{background:var(--sec);color:#d4d4d8;font:500 13px var(--sans);padding:4px 12px;border-radius:99px;white-space:nowrap}
.pcard{margin:4px 16px 8px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius)}
.pcard .l{flex:1;min-width:148px}
.pcard .btn-sm{font-size:13px;padding:0 10px}
.pcard .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:500;margin-bottom:8px;gap:8px}
.pcard .r1 .mono{font-size:13px;color:var(--muted)}
.bar{height:4px;border-radius:99px;background:var(--sec);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);border-radius:99px;transition:width .3s}
.btn{min-height:44px;padding:0 16px;border-radius:var(--radius);font-weight:600;font-size:17px;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35}
.btn-p{background:#f4f4f5;color:#18181b;width:100%}
.btn-s{background:var(--sec);color:#e4e4e7;font-weight:500}
.btn-sm{font-size:14px;padding:0 12px;white-space:nowrap}
.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 0 12px}
.chips{position:sticky;top:0;z-index:5;display:flex;flex-wrap:nowrap;overflow-x:auto;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--hair);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cf{flex:none;height:44px;padding:0 4px;display:flex;align-items:center}
.cf span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--border);color:#d4d4d8;font:500 15px var(--sans);white-space:nowrap}
.cf b{font:500 13px var(--mono);color:var(--muted)}
.cf.on span{background:#fafafa;border-color:#fafafa;color:#09090b}
.cf.on b{color:#52525b}
.cc{font-style:normal;color:var(--muted)}
.pkh{font-size:13px;font-weight:500;color:var(--dim);padding:16px 16px 4px}
.day{display:flex;align-items:center;gap:12px;margin:16px 16px 4px;font-size:13px;font-weight:500;color:var(--dim)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--hair)}
.tn{position:relative;display:block;width:100%;text-align:left;padding:12px 16px 12px 40px;cursor:pointer}
.tn:active{background:var(--card)}
.tn + .tn::before{content:"";position:absolute;top:0;left:40px;right:0;height:1px;background:var(--hair)}
.tn .dot{position:absolute;left:18px;top:19px;width:8px;height:8px;border-radius:99px;background:var(--orange)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;max-width:100%;padding:0 10px;border-radius:99px;background:var(--sec);color:#d4d4d8;font:500 13px var(--sans);margin-bottom:2px;border:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.gen{background:transparent;border:1px solid #3f3f46;color:var(--muted)}
.chip .ic{width:12px;height:12px;flex:none}
.due{display:inline-flex;align-items:center;gap:4px;height:22px;max-width:100%;padding:0 10px;border-radius:99px;background:var(--sec);color:#d4d4d8;font:500 13px var(--sans);margin:0 0 2px 6px;border:0;white-space:nowrap}
.due:first-child{margin-left:0}
.due .ic{width:12px;height:12px;flex:none}
.due.hot{color:#fb923c}
.tn.dn .due{opacity:.55}
.nd-due{margin:-8px 0 16px}
.nd-due .due{margin:0}
.tn p{font-size:16px;line-height:22px;white-space:pre-wrap;word-break:break-word}
.tn small{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:2px}

/* composer */
.comp{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 16px calc(var(--sab, env(safe-area-inset-bottom)) + 8px);background:var(--bg);border-top:1px solid var(--border)}
.comp textarea{flex:1;min-width:0;resize:none;height:44px;max-height:154px;background:var(--card);border:1px solid var(--border);border-radius:22px;color:var(--fg);font-size:17px;line-height:22px;padding:10px 16px;outline:none;overflow-y:auto}
.comp textarea::placeholder{color:var(--dim)}
.comp textarea:focus{border-color:#52525b}
.rb{flex:none;width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--sec);color:#e4e4e7}
.rb.send{background:#f4f4f5;color:#18181b}
.rb:active{transform:scale(.94)}
.comp[data-has="0"] #composer-send{display:none}
.fld{position:relative;flex:1;min-width:0;display:flex;align-items:flex-end}
.fld textarea{width:100%}
.comp textarea:disabled{opacity:.55}
.rwave{display:none;flex:1;min-width:0;height:44px;align-items:center;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:0 4px}
.rx{flex:none;width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rx .ic{width:16px;height:16px}
.rbars{flex:1;min-width:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.rbars i{display:block;width:3px;height:26px;border-radius:99px;background:#d4d4d8;transform:scaleY(.06);transition:transform .09s linear}
.rtm{flex:none;font:500 13px var(--mono);color:var(--muted);padding:0 12px 0 4px;white-space:nowrap}
.comp[data-rec="1"] .rwave{display:flex}
.comp[data-rec="1"] textarea{display:none}
.comp[data-rec="1"] #mic,.comp[data-tray="1"] #mic{display:none}
.comp[data-rec="1"] #composer-send{display:flex}
.comp[data-tray="1"] #composer-send{display:none}
.comp[data-rec="1"] #composer-send{box-shadow:0 0 0 3px rgba(244,244,245,.2)}
.comp[data-busy="1"]{border-top-color:transparent}
.comp[data-tray="1"]{display:none}
.rb{position:relative}
.rb:disabled{opacity:.35}
.strip{flex:none;display:none;flex-wrap:wrap;align-items:center;gap:0 12px;padding:6px 16px;background:var(--bg);border-top:1px solid var(--border)}
.strip.show{display:flex}
.strip ol{display:contents}
.strip li{list-style:none;display:flex;align-items:center;gap:6px;font-size:13px;line-height:24px;color:var(--dim);white-space:nowrap}
.strip li.active{color:var(--fg)}
.strip li.done{color:var(--muted)}
.strip .si{flex:none;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.strip .si svg{width:14px;height:14px}
.strip .spin{width:12px;height:12px;border-width:1.5px}
.sp-skip{flex:none;min-height:44px;margin:-10px 0 -10px auto;padding:0 0 0 4px;font-size:13px;font-weight:500;color:#d4d4d8;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.tray{flex:none;display:none;flex-direction:column;max-height:74vh;max-height:74dvh;background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.tray.show{display:flex}
.tr-h{flex:none;display:flex;align-items:center;min-height:52px;padding:0 4px 0 16px}
.tr-h b{font-size:17px;font-weight:600}
.tr-h .x{margin:0 0 0 auto}
.tr-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 8px}
.tr-l{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.02em;margin:0 0 4px}
.tr-o{padding:4px 0 12px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.tr-o p{font-size:14px;line-height:20px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.tr-o p.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tr-o .more{padding:6px 0;margin:0 0 -6px}
.tr-o .more[hidden]{display:none}
.tr-undo{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:14px;color:var(--muted)}
.tr-undo button{min-height:44px;padding:0 4px;font-weight:500;color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.tr-f{flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 16px calc(max(12px, var(--sab, env(safe-area-inset-bottom))) + 8px);border-top:1px solid var(--hair)}
.tr-f .btn-p{height:50px;border-radius:12px}
.tr-f .btn-p:disabled{opacity:.4}
.tr-raw{min-height:44px;font-size:13px;font-weight:400;color:var(--dim);text-decoration:underline;text-underline-offset:3px;text-align:center;align-self:center;padding:0 12px;background:none;border:0}
.tr-raw:active{color:var(--fg)}
.rpill{position:absolute;left:16px;z-index:70;height:28px;padding:0 12px;border-radius:99px;display:flex;align-items:center;gap:8px;background:var(--sec);border:1px solid var(--border);color:#d4d4d8;font:500 12px var(--sans);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.rpill[hidden]{display:none}
.rpill i{display:block;width:6px;height:6px;border-radius:99px;background:#d4d4d8}
#app.recp .nv-h,#app.recp .nd-h{padding-bottom:44px}
.pend{flex:none;max-height:42%;overflow-y:auto;padding:8px 16px 0;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.pend[hidden]{display:none}
.pc{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
.pc .pr1{display:flex;gap:10px;align-items:flex-start}
.pc .pi{flex:none;width:28px;height:28px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pc .pi svg{width:20px;height:20px}
.pc .px{flex:1;min-width:0}
.pc .px b{display:block;font-size:15px;line-height:20px;font-weight:600}
.pc .px span{display:block;font-size:14px;line-height:19px;color:var(--muted)}
.pc .pp{flex:none;width:36px;height:36px;border-radius:99px;background:var(--sec);color:#e4e4e7;display:flex;align-items:center;justify-content:center}
.pc .pp svg{width:16px;height:16px}
.pc .pb{display:flex;gap:8px}
.pc .pb .btn{min-height:44px;font-size:15px;flex:1;width:auto}

/* overlays */
.nv{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease,visibility .25s;visibility:hidden}
.nv.show{transform:none;visibility:visible}
.nv-h{flex:none;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px 8px}
.nv-h h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em;flex:1}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:99px;color:var(--muted)}
.nv-b{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px calc(var(--sab, env(safe-area-inset-bottom)) + 24px)}
.ov{margin-bottom:20px}
.ov .r1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--muted)}
.ov .r1 .mono{color:var(--fg)}
.ov .bar{height:6px}
.sec{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.sec-h{display:flex;width:100%;align-items:center;gap:12px;min-height:48px;padding:8px 16px;text-align:left}
.sec-h .n{flex:1;font-size:17px;font-weight:600}
.sec-h .c{font:13px var(--mono);color:var(--muted)}
.chev{width:16px;height:16px;color:var(--dim);transition:transform .2s}
.sec.open .chev{transform:rotate(180deg)}
.sec-b{border-top:1px solid var(--hair)}
.allok{padding:8px 16px}
.allok .btn{width:100%;min-height:44px;font-size:15px}
.it{position:relative;display:flex;align-items:center;transition:background .2s}
.it::before{content:"";position:absolute;top:0;left:48px;right:0;height:1px;background:var(--hair)}
.it.has{box-shadow:inset 0 0 0 1px var(--osoft)}
.cb{width:48px;align-self:stretch;min-height:56px;display:flex;align-items:center;justify-content:center;flex:none}
.cb span{width:24px;height:24px;border-radius:99px;border:1.5px solid #52525b;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s}
.cb span svg{width:14px;height:14px}
.it.on .cb span{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.it.on .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.row-m{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 0;text-align:left;align-self:stretch;min-height:56px}
.row-m.tap{cursor:pointer}
.row-m .tx{flex:1;min-width:0}
.nm{display:block;font-size:17px}
.sub{display:block;font-size:13px;color:var(--muted)}
.nb{display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none;min-width:44px;height:44px;padding:0 4px;margin:-12px -8px -12px -4px;color:var(--osoft);font:500 13px/1 var(--mono)}
.nb svg{width:16px;height:16px}
.aud{font-size:13px;line-height:18px;color:#71717a;margin-top:8px}
.nd-b .aud{margin:8px 0 12px}
.is-b .th .aud{margin:8px 0 0}

/* sheets */
.bd{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.bd.show{opacity:1;pointer-events:auto}
.z2.bd{z-index:40}.z2.sheet{z-index:41}
.z3.bd{z-index:50}.z3.sheet{z-index:51}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--border);border-radius:12px 12px 0 0;padding-bottom:var(--sab, env(safe-area-inset-bottom));transform:translateY(102%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s}
.sheet.show{transform:none;visibility:visible}
.sheet.tall{height:88%}
.grab{width:36px;height:4px;border-radius:99px;background:#3f3f46;margin:8px auto 0;flex:none}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;flex:none}
.sh-h .tx{flex:1;min-width:0}
.sh-h h2{font-size:20px;font-weight:600;line-height:26px}
.sh-h p{font-size:13px;color:var(--muted);margin-top:2px}
.x{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;margin:-8px -8px -8px 0}
.sh-b{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 16px;flex:1;min-height:0}
.sh-top{border-top:0;border-bottom:1px solid var(--hair);padding-top:12px}
.sec-b>.lbl{margin:12px 16px 4px}
.sh-f{flex:none;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--hair)}
.lbl{font-size:13px;font-weight:500;color:var(--muted);margin:0 16px 8px}
.ta{width:100%;min-height:80px;resize:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--fg);font-size:17px;line-height:22px;padding:12px;outline:none;display:block}
.ta::placeholder{color:var(--dim)}
.ta:focus{border-color:#71717a}
.sugg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px}
.sugg .ic{width:14px;height:14px}

/* split confirm */
.pr{display:flex;align-items:flex-start;gap:4px;padding:10px 0 12px;position:relative}
.pr + .pr::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--hair)}
.prx{flex:none;width:44px;height:44px;margin:-9px -12px -9px 0;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:99px}
.prx .ic{width:16px;height:16px}
.prx:active{color:var(--fg);background:var(--sec)}
.pcs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.pm{flex:1;min-width:0}
.pm .chip{height:28px;padding:0 10px}
.pm .chip .ic{width:14px;height:14px}
.chip.man{background:#3f3f46;color:var(--fg)}
.pd{height:28px;padding:0;margin:0}
.pd .dl{display:inline-flex;align-items:center;gap:4px;height:100%;padding:0 2px 0 10px;color:inherit;font:inherit}
.pd .dx{display:flex;align-items:center;justify-content:center;width:32px;height:100%;color:var(--muted)}
.pd .dx .ic{width:12px;height:12px}
.dpb{display:flex;flex-direction:column;gap:12px;padding:4px 16px 16px}
.dpb label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.dpb input{width:100%;min-width:0;height:48px;padding:0 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--fg);font:17px var(--sans);color-scheme:dark}
.pt{width:calc(100% + 20px);margin:-9px -10px -2px;resize:none;background:transparent;border:0;border-radius:8px;color:var(--fg);font-size:16px;line-height:22px;padding:11px 10px;outline:none;display:block;overflow:hidden;box-shadow:0 0 0 1px transparent}
.pt:focus{box-shadow:0 0 0 1px #52525b}

/* picker */
.srch{display:flex;align-items:center;gap:8px;margin:0 16px 8px;height:44px;padding:0 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--dim)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);font-size:17px}
.srch input::placeholder{color:var(--dim)}
.pk{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 16px;text-align:left;position:relative}
.pk + .pk::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.pk:active{background:var(--card)}
.pk .tx{flex:1;min-width:0}
.pk b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk small{display:block;font-size:13px;color:var(--muted)}
.pk .ic{color:var(--fg);width:18px;height:18px}

/* note detail */
.nd{position:absolute;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease,visibility .25s;visibility:hidden}
.nd.show{transform:none;visibility:visible}
.nd-h{flex:none;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 12px) 8px 8px 8px;border-bottom:1px solid var(--hair)}
.nd-h .tt{flex:1;min-width:0;display:flex;justify-content:center}
.nd-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px}
.nd-t{font-size:17px;line-height:24px;white-space:pre-wrap;word-break:break-word;margin:6px 0 4px}
.nd-m{font-size:13px;color:var(--muted);margin-bottom:16px}

</div>

/* API client: resolves with parsed JSON, rejects with {status} (0 = network/timeout) */
async function apiPost(path, body, type, signal){
  let r;
  try { r = await fetch(path, {method:"POST", headers:{"Content-Type":type}, body, signal:signal || AbortSignal.timeout(30000)}); }
  catch { throw {status:0}; }
  if (!r.ok) throw {status:r.status};
  try { return await r.json(); } catch { throw {status:502}; }
}
/* server notes -> split-confirm parts; itemId equals the client item key; a missing dueDate falls back to the local parseDue */
function partsFromApi(notes, orig){
  return notes.map(n => {
    const it = n.itemId && itemByTitle[n.itemId] ? n.itemId : null;
    let text = tidy(n.text || ""), dueDate = n.dueDate || null, dueText = dueDate ? (n.dueText || null) : null;
    if (!dueDate){ const d = parseDue(text); if (d.dueDate){ dueDate = d.dueDate; dueText = d.dueText; text = cap(stripSpans(text, d.spans)) || text; } }
    return {orig, quote:n.quote || "", itemTitle:it, cat:it ? itemByTitle[it].cat : (CATK[n.category] || "misc"), text, dueDate, dueText};
  });
}
/* API parse -> split sheet. Resolves {notes} or rejects {status}; callers decide how to fall back */
async function parseApi(text, signal){
  const r = await apiPost("/api/parse", JSON.stringify({text}), "application/json", signal);
  if (!Array.isArray(r.notes) || !r.notes.length) throw {status:502};
  return r.notes;
}

function recClock(){ const ms = recMs(); $("v-time").textContent = fmtT(ms) + (ms >= MAX_REC_MS - 60000 ? " / " + TOTAL_LABEL : ""); syncPill(); }
