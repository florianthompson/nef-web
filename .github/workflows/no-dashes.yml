name: no-dashes

on:
  pull_request:

jobs:
  check-dashes:
    name: UI copy has no em or en dashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for em and en dashes
        run: npm run check:dashes
