<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06060a">
<title>Keine Verbindung</title>
<style>
  html,body{margin:0;height:100%;background:#06060a;color:#f4f4f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
  .tag{background:#e5322d;color:#fff;font:800 14px ui-monospace,monospace;padding:8px 12px;border-radius:8px}
  h1{margin:8px 0 0;font-size:22px}
  p{margin:0;color:#9a9aa6;font-size:14px;max-width:320px}
  button{margin-top:12px;background:#e5322d;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<main>
  <span class="tag">NEF</span>
  <h1>Keine Verbindung</h1>
  <p>Die Seite konnte nicht geladen werden. Bitte prüfe deine Internetverbindung.</p>
  <button onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
